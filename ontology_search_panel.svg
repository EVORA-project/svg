<svg xmlns="http://www.w3.org/2000/svg" width="176" height="59" viewBox="0 0 176 59" role="img" aria-labelledby="title desc">
  <title id="title">Ontology content, Search and lookup, Cross-references and mappings panel</title>
  <desc id="desc">A rounded rectangular white panel with three grey icons and labels: Ontology content, Search and lookup, and Cross-references and mappings.</desc>
  <defs>
    <style>
      .panel { fill:#ffffff; stroke:#bcbcbc; stroke-width:1.2; }
      .icon { fill:none; stroke:#666666; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family: Arial, Helvetica, sans-serif; fill:#555555; text-anchor:middle; font-size:7.2px; font-weight:600; }
      .label-small { font-family: Arial, Helvetica, sans-serif; fill:#555555; text-anchor:middle; font-size:6.6px; font-weight:600; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="173" height="56" rx="9" ry="9" class="panel"/>

  <!-- item 1: folder -->
  <g transform="translate(26 19)">
    <path class="icon" d="M-10 -5 h7 l2.8 3 h12 c1.1 0 2 0.9 2 2 v10 c0 1.1-0.9 2-2 2 h-22 c-1.1 0-2-0.9-2-2 v-13 c0-1.1 0.9-2 2-2 z"/>
    <path class="icon" d="M-12 2 h26"/>
  </g>
  <text x="28" y="40" class="label">
    <tspan x="28" dy="0">Ontology</tspan>
    <tspan x="28" dy="8">content</tspan>
  </text>

  <!-- item 2: magnifying glass -->
  <g transform="translate(76 18)">
    <circle cx="-1.5" cy="-0.5" r="6.2" class="icon"/>
    <path class="icon" d="M3.2 4.2 L9.2 10.2"/>
  </g>
  <text x="76" y="40" class="label">
    <tspan x="76" dy="0">Search &amp;</tspan>
    <tspan x="76" dy="8">lookup</tspan>
  </text>

  <!-- item 3: chain link -->
  <g transform="translate(126 18) rotate(-40)">
    <path class="icon" d="M-7.8 -2.7 H-3.5 A3.8 3.8 0 0 1 0.3 1.1 V1.1 A3.8 3.8 0 0 1 -3.5 4.9 H-7.8 A3.8 3.8 0 0 1 -11.6 1.1 V1.1 A3.8 3.8 0 0 1 -7.8 -2.7 Z"/>
    <path class="icon" d="M3.5 -2.7 H7.8 A3.8 3.8 0 0 1 11.6 1.1 V1.1 A3.8 3.8 0 0 1 7.8 4.9 H3.5 A3.8 3.8 0 0 1 -0.3 1.1 V1.1 A3.8 3.8 0 0 1 3.5 -2.7 Z"/>
    <path class="icon" d="M-1.8 1.1 H1.8"/>
  </g>
  <text x="126" y="39.5" class="label-small">
    <tspan x="126" dy="0">Cross-references</tspan>
    <tspan x="126" dy="7.6">&amp; mappings</tspan>
  </text>
</svg>
